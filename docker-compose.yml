services:
  klartion:
    image: daalves/klartion:latest
    container_name: klartion
    labels:
      - com.centurylinklabs.watchtower.scope=klartion
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/compose:ro

  watchtower:
    image: nickfedor/watchtower
    container_name: klartion-watchtower
    labels:
      - com.centurylinklabs.watchtower.scope=klartion
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --cleanup --interval 86400 --http-api-update --http-api-periodic-polls klartion
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - WATCHTOWER_LOG_LEVEL=warn
      - WATCHTOWER_HTTP_API_TOKEN=klartion-update
      # Own scope, so a server-wide Watchtower on the same host neither removes
      # this one as an "excess instance" nor gets removed by it.
      - WATCHTOWER_SCOPE=klartion
